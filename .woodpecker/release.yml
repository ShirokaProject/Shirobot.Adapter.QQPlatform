when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

labels:
  platform: linux/amd64
  ci: domain-linux-native

skip_clone: true

steps:
  - name: build-and-publish
    image: bash
    environment:
      ZOT_USERNAME:
        from_secret: zot_username
      ZOT_PASSWORD:
        from_secret: zot_password
      GITEA_RELEASE_TOKEN:
        from_secret: gitea_release_token
    commands:
      - |
        set -eu

        release_tag="${CI_COMMIT_TAG:-${RELEASE_TAG:-}}"
        case "$release_tag" in
          v[0-9]*) ;;
          *) echo "Expected a v-prefixed semantic version, got: $release_tag" >&2; exit 1 ;;
        esac

        git init .
        git remote add origin https://git.oeo.one/justme/Shirobot.Adapter.QQPlatform.git
        git fetch --depth=1 origin "refs/tags/$release_tag"
        git checkout --detach FETCH_HEAD

        mkdir -p ../Shirobot
        git -C ../Shirobot init
        git -C ../Shirobot remote add origin https://git.oeo.one/justme/Shirobot.git
        git -C ../Shirobot fetch --depth=1 origin master
        git -C ../Shirobot checkout --detach FETCH_HEAD

        dotnet build ShiroBot.Adapter.QQPlatform.sln -c Release
        dotnet test tests/ShiroBot.QQPlatform.Tests/ShiroBot.QQPlatform.Tests.csproj -c Release --no-build
        dotnet publish ShiroBot.Adapter.QQPlatform.csproj -c Release -o artifacts/publish/qq-official

        package_dir="artifacts/release"
        mkdir -p "$package_dir"
        cp artifacts/publish/qq-official/ShiroBot.Adapter.QQPlatform.dll "$package_dir/"
        (cd "$package_dir" && sha256sum ShiroBot.Adapter.QQPlatform.dll > ShiroBot.Adapter.QQPlatform.dll.sha256)

        api_root="https://git.oeo.one/api/v1/repos/justme/Shirobot.Adapter.QQPlatform"
        if ! release_json="$(curl -fsS -H "Authorization: token $GITEA_RELEASE_TOKEN" "$api_root/releases/tags/$release_tag" 2>/dev/null)"; then
          release_commit="$(git rev-parse HEAD)"
          release_json="$(curl -fsS -X POST "$api_root/releases" \
            -H "Authorization: token $GITEA_RELEASE_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"$release_tag\",\"target_commitish\":\"$release_commit\",\"name\":\"$release_tag\",\"body\":\"QQPlatform adapter $release_tag. Download ShiroBot.Adapter.QQPlatform.dll and verify it with the accompanying SHA-256 file. OCI artifact: registry.oeo.one/justme/shirobot-adapter-qqplatform:$release_tag\"}")"
        fi
        release_id="$(printf '%s\n' "$release_json" | tr ',' '\n' | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p' | head -n 1)"
        test -n "$release_id"
        release_assets="$(curl -fsS -H "Authorization: token $GITEA_RELEASE_TOKEN" "$api_root/releases/$release_id/assets")"
        for file in "$package_dir/ShiroBot.Adapter.QQPlatform.dll" "$package_dir/ShiroBot.Adapter.QQPlatform.dll.sha256"; do
          asset_name="$(basename "$file")"
          if printf '%s' "$release_assets" | tr -d '[:space:]' | grep -Fq "\"name\":\"$asset_name\""; then
            continue
          fi
          curl -fsS -X POST "$api_root/releases/$release_id/assets?name=$asset_name" \
            -H "Authorization: token $GITEA_RELEASE_TOKEN" \
            -F "attachment=@$file" > /dev/null
        done

        tool_dir="$(mktemp -d)"
        trap 'rm -rf "$tool_dir"' EXIT
        curl -fsSL https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz -o "$tool_dir/oras.tgz"
        tar -xzf "$tool_dir/oras.tgz" -C "$tool_dir" oras
        printf '%s' "$ZOT_PASSWORD" | "$tool_dir/oras" login --registry-config "$tool_dir/auth.json" registry.oeo.one -u "$ZOT_USERNAME" --password-stdin
        "$tool_dir/oras" push --registry-config "$tool_dir/auth.json" --artifact-type application/vnd.shiro.bot.qqplatform-adapter.v1 \
          "registry.oeo.one/justme/shirobot-adapter-qqplatform:$release_tag" \
          "$package_dir/ShiroBot.Adapter.QQPlatform.dll:application/octet-stream" \
          "$package_dir/ShiroBot.Adapter.QQPlatform.dll.sha256:text/plain"
